[package]
name = "lambdust"
version = "0.2.0"
edition = "2024"
authors = ["Mitsuki Akasaka <m.akasaka@miraina-step.co.jp>"]
description = "A Scheme dialect with gradual typing and effect systems"
license = "MIT OR Apache-2.0"
repository = "https://github.com/username/lambdust"
keywords = ["scheme", "lisp", "functional", "types", "compiler"]
categories = ["compilers", "development-tools"]
include = [
    "src/**/*.rs",
    "stdlib/**/*.scm",
    "Cargo.toml",
    "README.md",
    "LICENSE*",
]

[lib]
name = "lambdust"
path = "src/lib.rs"

[[bin]]
name = "lambdust"
path = "src/main.rs"

[[bin]]
name = "performance-monitor"
path = "src/bin/performance_monitor.rs"

[dependencies]

# Date and time for reporting
chrono = { version = "0.4", features = ["serde"] }

# AST and data structures
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = "2.0"
im = "15.1"                                        # Immutable data structures for functional programming
paste = "1.0"                                      # Macro paste for token concatenation

# Type system and inference
petgraph = "0.6" # For type dependency graphs
ena = "0.14"     # Union-find for type unification

# Evaluation and runtime
gc = { version = "0.5", features = [
    "derive",
] } # Garbage collection for Scheme values
once_cell = "1.19"
lazy_static = "1.4"

# Concurrency and parallelism
tokio = { version = "1.0", features = [
    "full",
    "io-util",
    "net",
    "fs",
    "process",
    "macros",
    "rt-multi-thread",
    "time",
    "sync",
], optional = true }
tokio-util = { version = "0.7", features = ["codec", "io"], optional = true }
async-std = { version = "1.12", optional = true }
rayon = "1.8"
crossbeam = "0.8" # For channels and concurrent data structures
crossbeam-utils = "0.8" # For Backoff and other utilities
fastrand = "2.0" # Fast random number generator
num_cpus = "1.16" # For detecting CPU count

# Error handling and diagnostics
ariadne = "0.4" # Beautiful error reporting
log = "0.4"     # Logging for parser benchmarking

# FFI and interop
libloading = "0.8"
dlopen2 = "0.7"
libc = "0.2" # C standard library bindings
libffi = { version = "3.2", optional = true, features = [
    "system",
] } # Foreign Function Interface for C interop
cc = { version = "1.0", optional = true } # C compiler integration

# Performance and optimization
criterion = { version = "0.5", optional = true }
flame = { version = "0.2", optional = true }

# CLI and utilities
rustyline = { version = "13.0", optional = true } # REPL readline support
colored = { version = "2.0", optional = true }
dirs = { version = "5.0", optional = true }

# Enhanced REPL dependencies
reedline = { version = "0.29", optional = true }     # Advanced line editor with completions
nu-ansi-term = { version = "0.49", optional = true } # Terminal colors and styling
crossterm = { version = "0.27", optional = true }    # Cross-platform terminal manipulation
syntect = { version = "5.1", optional = true }       # Syntax highlighting

# I/O and Network Libraries
mio = { version = "0.8", features = ["os-poll", "net"] } # Low-level I/O
socket2 = "0.5" # Advanced socket operations
nix = { version = "0.28", features = [
    "event",
    "fs",
], optional = true } # Unix system calls
winapi = { version = "0.3", features = [
    "winnt",
    "winsock2",
    "ws2ipdef",
    "ws2tcpip",
], optional = true } # Windows APIs
memmap2 = "0.9" # Memory-mapped files
notify = "6.1" # File system monitoring
walkdir = "2.4" # Recursive directory traversal
ignore = "0.4" # .gitignore-style ignore patterns
globset = "0.4" # Glob pattern matching
url = "2.5" # URL parsing for network I/O
percent-encoding = "2.3" # URL encoding/decoding
hickory-resolver = "0.24" # DNS resolver (formerly trust-dns)

# Compression and encryption
flate2 = { version = "1.0", optional = true } # Gzip/deflate compression
zstd = { version = "0.13", optional = true } # Zstandard compression
lz4_flex = { version = "0.11", optional = true } # LZ4 compression
ring = "0.17" # Cryptography
rustls = { version = "0.23", features = [
    "std",
], optional = true } # TLS implementation
tokio-rustls = { version = "0.26", optional = true } # Async TLS for tokio
webpki-roots = { version = "0.26", optional = true } # Root certificates

# Development and testing
proptest = { version = "1.4", optional = true }
rand = "0.8"                                    # For random test data generation
rand_xorshift = "0.3"                               # Fast PRNG for property testing
futures = "0.3"                                 # For futures utilities in tests

# Text processing
unicode-normalization = "0.1"
unicode-segmentation = "1.10"
icu_collator = { version = "1.4", optional = true } # Unicode collation for text processing
icu_locid = { version = "1.4", optional = true }    # ICU locale support
lru = "0.12"

# Numeric traits for monad implementations
num-traits = "0.2"

# Concurrent data structures
dashmap = "5.5"  # Concurrent HashMap for distributed systems

# Floating point ordering
ordered-float = "4.2"  # For consistent floating point ordering in distributed load balancing

# JIT compilation with LLVM support
inkwell = { version = "0.4", features = ["llvm15-0"], optional = true }
llvm-sys = { version = "150", optional = true }
cranelift = { version = "0.105", optional = true }
cranelift-codegen = { version = "0.105", optional = true }
cranelift-frontend = { version = "0.105", optional = true }
cranelift-module = { version = "0.105", optional = true }
cranelift-jit = { version = "0.105", optional = true }

# Memory optimization for dependent type system
bumpalo = { version = "3.14", features = ["collections"] }

# Concurrency and async runtime
async-trait = "0.1"                                    # For async traits in actors
uuid = { version = "1.6", features = ["v4", "serde"] } # For unique IDs

# Serialization and cryptography for fault tolerance
bincode = "1.3"                                         # High-performance binary serialization
sha2 = "0.10"                                           # SHA-2 hash functions for integrity
futures-util = "0.3"                                   # Futures utilities
regex = "1.10"                                          # Regular expressions

[dev-dependencies]
pretty_assertions = "1.4"
insta = "1.34"                                               # Snapshot testing for AST
tempfile = "3.8"
tokio-test = "0.4"                                           # For async testing
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"                                                 # Random testing utilities
futures = "0.3"                                              # Futures utilities for async tests

[features]
# Lightweight default configuration for minimal binary size
default = ["minimal-repl"]

# REPL configurations
minimal-repl = ["dep:colored"] # Lightweight REPL with basic colors
repl = ["minimal-repl", "dep:rustyline", "dep:dirs"] # Full-featured REPL
enhanced-repl = [
    "repl",
    "dep:reedline",
    "dep:nu-ansi-term",
    "dep:crossterm",
    "dep:syntect",
]

# Runtime configurations  
async-runtime = ["tokio", "tokio-util"] # Async runtime (heavy dependency)
network-io = [
    "async-runtime",
    "rustls",
    "tokio-rustls",
    "webpki-roots",
] # Network I/O
platform-extensions = [
    "unix-extensions",
    "windows-extensions",
] # Platform-specific APIs

# Legacy compatibility (opt-in only)
async = ["async-runtime"]                           # Backward compatibility
advanced-io = ["network-io", "platform-extensions"] # Backward compatibility
text-processing = ["icu_collator", "icu_locid"]
compression = ["flate2", "zstd", "lz4_flex"]
tls = ["rustls", "tokio-rustls", "webpki-roots"]
unix-extensions = ["nix"]
windows-extensions = ["winapi"]
benchmarks = ["criterion", "flame"]
property-testing = ["proptest"]
multithreaded-tests = ["async", "tokio/test-util"]
ffi = ["libffi", "cc"]                              # FFI support
jit = ["inkwell", "llvm-sys", "cranelift", "cranelift-codegen", "cranelift-frontend", "cranelift-module", "cranelift-jit"] # JIT compilation support
# SIMD optimization features (Phase 3.5 integration strategy)
simd = []                                           # Basic SIMD framework
portable_simd = []                                  # Portable SIMD types (nightly feature)
simd_optimized = ["simd", "portable_simd"]         # Full SIMD optimizations
simd-avx512 = ["simd_optimized"]                   # AVX-512 SIMD support
simd-neon = ["simd_optimized"]                     # ARM NEON SIMD support

# Phase 5: Advanced Runtime Optimizations - Stage-based feature activation
stage1 = ["trait-optimization", "jit-integration"] # Stage 1: JIT integration system
stage2 = ["stage1", "parallel-execution"]          # Stage 2: Parallel execution system
stage3 = ["stage2", "distributed-computing"]       # Stage 3: Distributed computing support
stage4 = ["stage3", "security-integration"]        # Stage 4: Security integration  
stage5 = ["stage4", "performance-integration"]     # Stage 5: Performance integration
stage6 = ["stage5", "quality-assurance"]           # Stage 6: Quality assurance

# Legacy Phase 4.1 features (maintained for backwards compatibility)
legacy-stage3 = ["stage2", "nan-boxing-optimization"]     # Legacy: NaN boxing integration  
legacy-stage4 = ["legacy-stage3", "arena-optimization"]   # Legacy: Arena allocation
legacy-stage5 = ["legacy-stage4", "simd-optimization"]    # Legacy: SIMD acceleration

# Type System Features
hindley-milner = [] # Hindley-Milner type inference
monad-aware = ["hindley-milner"] # Monad-aware type system
experimental-type-system = [
    "hindley-milner",
    "monad-aware",
] # Advanced type system features

simd-benchmarks = ["benchmarks"] # SIMD optimization benchmarking

# Formal methods integration (advanced feature)
formal-methods = [] # Event-B/B-Method integration
isabelle-hol = ["formal-methods"] # Isabelle/HOL proof integration  
event-b = ["formal-methods"] # Event-B machine translation
b-method = ["formal-methods"] # B-Method specification support
certified-translation = [
    "formal-methods",
    "isabelle-hol",
    "event-b",
    "b-method",
] # Full formal verification stack

# Phase 4.1 optimization features (gradual integration)
trait-optimization = []           # Stage 1: Basic trait framework
# Phase 5: Advanced Runtime Optimization Features
jit-integration = []              # Stage 1: JIT integration system
parallel-execution = []           # Stage 2: Parallel execution system
distributed-computing = []        # Stage 3: Distributed computing support
security-integration = []         # Stage 4: Security integration
performance-integration = []      # Stage 5: Performance integration  
quality-assurance = []            # Stage 6: Quality assurance

# Legacy Phase 4.1 optimization features
nan-boxing-optimization = []      # Legacy: NaN boxing integration
arena-optimization = []           # Legacy: Arena allocation
simd-optimization = []            # Legacy: SIMD acceleration
vertical-integration = []         # Legacy: Dependency reduction

# The stage features are now defined above in the main features section

# internal-parser = [] # 廃止済み (2025年8月12日) - nom互換レイヤー削除により不要

# Benchmark configuration
# Only includes existing benchmark files

[[bench]]
name = "comprehensive_value_optimization_benchmarks"
path = "benches/comprehensive_value_optimization_benchmarks.rs"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "memory_optimization_baseline"
path = "benches/memory_optimization_baseline.rs"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "value_optimization_simple"
path = "benches/value_optimization_simple.rs"
harness = false
required-features = ["benchmarks"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.test]
opt-level = 1

# JIT Performance Benchmarks
[[bench]]
name = "jit_performance_benchmarks"
path = "benches/jit_performance_benchmarks.rs"
harness = false
required-features = ["benchmarks"]

# SIMD Comprehensive Benchmarks
[[bench]]
name = "simd_comprehensive_benchmarks"
path = "benches/simd_comprehensive_benchmarks.rs"
harness = false
required-features = ["benchmarks", "simd"]

# Phase 3.5 Integration Benchmarks
[[bench]]
name = "phase3_5_integration_benchmarks"
path = "benches/phase3_5_integration_benchmarks.rs"
harness = false
required-features = ["benchmarks"]

# Lint configuration for crates.io quality
[lints.rust]
# All warnings as errors for crates.io quality
missing_docs = "warn"
unused_variables = "warn"
unused_imports = "warn"
dead_code = "warn"

