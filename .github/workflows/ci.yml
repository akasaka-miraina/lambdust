name: Continuous Integration

on:
  push:
    branches: [ main, develop, '0.2.0' ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 1  # Reduce parallelism to prevent OOM/segfaults
  CARGO_INCREMENTAL: 0  # Disable incremental compilation for stable builds

jobs:
  # Code Quality Checks
  check:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # LLVM dependencies disabled for CI stability
      # - name: Install system dependencies
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y llvm-15-dev libclang-15-dev

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true

      - name: Run clippy (library)
        run: cargo clippy --lib --no-default-features -- -D warnings

      - name: Run clippy (binaries)  
        run: cargo clippy --bins --no-default-features -- -D warnings

      - name: Check library compilation
        run: cargo check --lib --no-default-features

      - name: Check binary compilation
        run: cargo check --bins --no-default-features

  # Unit and Integration Tests
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta]
        exclude:
          - os: windows-latest
            rust: beta
          - os: macos-latest
            rust: beta
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-15-dev libclang-15-dev

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install llvm@15

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}-${{ matrix.rust }}
          cache-on-failure: true

      - name: Run unit tests
        run: cargo test --lib --no-default-features

      - name: Run integration tests
        run: cargo test --test '*' --no-default-features

      - name: Run doctests
        run: cargo test --doc --no-default-features

  # Build Verification
  build:
    name: Build Verification
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        profile: [dev, release]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # LLVM dependencies disabled for CI stability across all platforms
      # - name: Install system dependencies
      #   if: matrix.os == 'ubuntu-latest'
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y llvm-15-dev libclang-15-dev

      # - name: Install system dependencies (macOS)
      #   if: matrix.os == 'macos-latest'
      #   run: |
      #     brew install llvm@15

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.os }}-${{ matrix.profile }}
          cache-on-failure: true

      - name: Build library
        run: cargo build --lib --no-default-features ${{ matrix.profile == 'release' && '--release' || '' }}

      - name: Build binaries
        run: cargo build --bins --no-default-features ${{ matrix.profile == 'release' && '--release' || '' }}

  # Feature Testing
  features:
    name: Feature Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # LLVM dependencies disabled for CI stability
      # - name: Install system dependencies
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y llvm-15-dev libclang-15-dev

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: features
          cache-on-failure: true

      - name: Test minimal features
        run: |
          echo "Testing core functionality without LLVM dependencies..."
          cargo test --no-default-features
          echo "✅ Core functionality test completed"

      - name: Build verification
        run: |
          echo "Building core functionality..."
          cargo build --no-default-features
          cargo check --no-default-features
          echo "✅ Build verification completed"

  # Minimum Supported Rust Version
  msrv:
    name: MSRV (1.75.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust 1.75.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75.0

      # LLVM dependencies disabled for CI stability
      # - name: Install system dependencies
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y llvm-15-dev libclang-15-dev

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
          cache-on-failure: true

      - name: Check MSRV compilation
        run: cargo check --lib --no-default-features

      - name: Test MSRV
        run: cargo test --lib --no-default-features