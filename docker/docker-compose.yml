version: '3.8'
services:
  ubuntu-test:
    build: 
      context: .
      dockerfile: ubuntu-test/Dockerfile
    image: lambdust-ubuntu-test:latest
    volumes:
      - ../:/workspace:cached
    environment:
      - CARGO_HOME=/workspace/.cargo
      - RUST_BACKTRACE=1
      - CARGO_TERM_COLOR=always
    working_dir: /workspace
    command: /bin/bash
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/tmp:noexec,nosuid,size=50m
    security_opt:
      - no-new-privileges:true

  memory-safety:
    build:
      context: memory-safety
      dockerfile: Dockerfile
    image: lambdust-memory-safety:latest
    volumes:
      - ../:/workspace:cached
    environment:
      - CARGO_HOME=/workspace/.cargo
      - RUST_BACKTRACE=full
      - CARGO_TERM_COLOR=always
      - RUST_MIN_STACK=4194304
    working_dir: /workspace
    command: /bin/bash
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/tmp:noexec,nosuid,size=50m
      - /workspace/.cargo/registry:noexec,nosuid,size=200m
    cap_add:
      - SYS_PTRACE
    security_opt:
      - no-new-privileges:true
      # Keep seccomp:unconfined for memory safety debugging tools

  performance-validation:
    build:
      context: performance-validation
      dockerfile: Dockerfile
    image: lambdust-performance:latest
    volumes:
      - ../:/workspace:cached
    environment:
      - CARGO_HOME=/workspace/.cargo
      - RUST_BACKTRACE=1
      - CARGO_TERM_COLOR=always
      - CARGO_INCREMENTAL=0
    working_dir: /workspace
    command: /bin/bash
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/tmp:noexec,nosuid,size=50m
    security_opt:
      - no-new-privileges:true