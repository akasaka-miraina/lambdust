version: '3.8'

services:
  r7rs-validation:
    build:
      context: .
      dockerfile: Dockerfile
    image: lambdust-r7rs-compliance:latest
    container_name: lambdust-r7rs-validation
    volumes:
      - ../../:/workspace:cached
      - /tmp:/tmp:cached
    environment:
      - CARGO_HOME=/workspace/.cargo
      - RUST_BACKTRACE=full
      - RUST_MIN_STACK=8388608
      - CARGO_TERM_COLOR=always
      - CARGO_TARGET_DIR=/tmp/cargo-target
    working_dir: /workspace
    command: /bin/bash
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=500m
      - /var/tmp:noexec,nosuid,size=100m
      - /workspace/.cargo/registry:noexec,nosuid,size=300m
    cap_add:
      - SYS_PTRACE
    security_opt:
      - no-new-privileges:true
      # Keep seccomp:unconfined for R7RS compliance testing tools
    ulimits:
      memlock: -1
      stack: 67108864  # 64MB stack limit
    mem_limit: 4g
    cpus: 2.0

  r7rs-memory-safety:
    build:
      context: .
      dockerfile: Dockerfile
    image: lambdust-r7rs-compliance:latest
    container_name: lambdust-r7rs-memory-safety
    volumes:
      - ../../:/workspace:cached
      - /tmp:/tmp:cached
    environment:
      - CARGO_HOME=/workspace/.cargo
      - RUST_BACKTRACE=full
      - RUST_MIN_STACK=8388608
      - CARGO_TERM_COLOR=always
      - CARGO_TARGET_DIR=/tmp/cargo-target-sanitizer
      - RUSTFLAGS=-Z sanitizer=address
      - ASAN_OPTIONS=detect_odr_violation=0:fast_unwind_on_malloc=0
    working_dir: /workspace
    command: /bin/bash
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=1g
      - /var/tmp:noexec,nosuid,size=200m
      - /workspace/.cargo/registry:noexec,nosuid,size=400m
    cap_add:
      - SYS_PTRACE
    security_opt:
      - no-new-privileges:true
      # Keep seccomp:unconfined for AddressSanitizer
    ulimits:
      memlock: -1
      stack: 134217728  # 128MB stack for sanitizers
    mem_limit: 8g  # More memory for sanitizers
    cpus: 2.0

  r7rs-interpreter-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: lambdust-r7rs-compliance:latest
    container_name: lambdust-r7rs-interpreter
    volumes:
      - ../../:/workspace:cached
      - /tmp:/tmp:cached
    environment:
      - CARGO_HOME=/workspace/.cargo
      - RUST_BACKTRACE=1
      - CARGO_TERM_COLOR=always
      - CARGO_TARGET_DIR=/tmp/cargo-target-release
    working_dir: /workspace
    command: /bin/bash
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=500m
      - /var/tmp:noexec,nosuid,size=100m
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0

networks:
  default:
    driver: bridge